priority_rules:
  - name: security-updates
    conditions:
      - base = main
      - label = security
    priority: high

pull_request_rules:
  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update:

  - name: Label web app changes
    conditions:
      - files ~= ^apps/web/
    actions:
      label:
        add:
          - area/frontend

  - name: Label documentation changes
    conditions:
      - files ~= ^docs/
    actions:
      label:
        add:
          - documentation
          - area/docs
