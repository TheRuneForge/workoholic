merge_queue:
  mode: serial
  max_parallel_checks: 1
  queue_controls_comment: true
  status_comments: outcomes

queue_rules:
  - name: main
    merge_method: squash
    batch_size: 5
    queue_conditions:
      - base = main
      - -draft
    merge_conditions:
      - base = main
      - check-success = test
      - "#approved-reviews-by >= 2"

priority_rules:
  - name: security-updates
    conditions:
      - base = main
      - label = security
    priority: high

pull_request_rules:
  - name: automatically queue pull requests
    conditions:
      - base = main
      - -draft
    actions:
      queue:

  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update:

  - name: Request reviews automatically
    conditions:
      - -draft
      - "#review-requested = 0"
    actions:
      request_reviews:
        teams:
          - ai

  - name: Label web app changes
    conditions:
      - files ~= ^apps/web/
    actions:
      label:
        add:
          - area/frontend

  - name: Label documentation changes
    conditions:
      - files ~= ^docs/
    actions:
      label:
        add:
          - documentation
          - area/docs
