name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # A deployment needs the token and the complete app configuration. Checking
  # only the token lets an incomplete setup fail later inside tools/deploy.sh.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SECRETS_STORE_ID: ${{ secrets.SECRETS_STORE_ID }}
          CONFIG_NAMESPACE: ${{ secrets.CONFIG_NAMESPACE }}
          SITE_FAMILY: ${{ secrets.SITE_FAMILY }}
          THEME_KEY_PREFIX: ${{ secrets.THEME_KEY_PREFIX }}
        run: |
          missing=
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_HOST \
            CF_ACCESS_TEAM_DOMAIN CF_ACCESS_AUD D1_DATABASE_NAME D1_DATABASE_ID \
            SECRETS_STORE_ID CONFIG_NAMESPACE SITE_FAMILY THEME_KEY_PREFIX; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Deployment skipped: configure these repository Actions secrets:$missing"
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "All required Cloudflare deployment secrets are present."
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: sh tools/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SECRETS_STORE_ID: ${{ secrets.SECRETS_STORE_ID }}
          CONFIG_NAMESPACE: ${{ secrets.CONFIG_NAMESPACE }}
          SITE_FAMILY: ${{ secrets.SITE_FAMILY }}
          THEME_KEY_PREFIX: ${{ secrets.THEME_KEY_PREFIX }}
          THEME_COOKIE_DOMAIN: ${{ secrets.THEME_COOKIE_DOMAIN }}
