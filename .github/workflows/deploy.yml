name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Forks have no deployment token; configured deployments must fail clearly
  # when any required setting is missing rather than silently skipping deploy.
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME || 'workoholic' }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SECRETS_STORE_ID: ${{ secrets.SECRETS_STORE_ID }}
          CONFIG_NAMESPACE: ${{ secrets.CONFIG_NAMESPACE }}
          SITE_FAMILY: ${{ secrets.SITE_FAMILY || 'Workoholic' }}
          THEME_KEY_PREFIX: ${{ secrets.THEME_KEY_PREFIX }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare deployment token is configured; deployment is skipped."
            echo "ready=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          missing=
          for name in CLOUDFLARE_ACCOUNT_ID PUBLIC_HOST CF_ACCESS_TEAM_DOMAIN \
            CF_ACCESS_AUD D1_DATABASE_ID SECRETS_STORE_ID CONFIG_NAMESPACE \
            THEME_KEY_PREFIX; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Cloudflare deployment token is configured, but required Actions secrets are missing:$missing"
            exit 1
          fi

          echo "All required Cloudflare deployment settings are present."
          echo "ready=true" >>"$GITHUB_OUTPUT"

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js, npm and pipx from Ubuntu APT
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs npm pipx
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run tests
        id: tests
        env:
          MERGIFY_TEST_JOB_NAME: deploy (web)
        run: npm test
      - name: Mergify Test Engine Upload (Node.js tests)
        if: (success() || failure()) && hashFiles('junit.xml') != ''
        env:
          MERGIFY_TEST_JOB_NAME: deploy (node)
        run: |
          python3 tools/mergify-junit.py junit.xml
          pipx run --spec mergify-cli==2026.11.17 mergify ci junit-process junit.xml
      - run: sh tools/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME || 'workoholic' }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SECRETS_STORE_ID: ${{ secrets.SECRETS_STORE_ID }}
          CONFIG_NAMESPACE: ${{ secrets.CONFIG_NAMESPACE }}
          SITE_FAMILY: ${{ secrets.SITE_FAMILY || 'Workoholic' }}
          THEME_KEY_PREFIX: ${{ secrets.THEME_KEY_PREFIX }}
          THEME_COOKIE_DOMAIN: ${{ secrets.THEME_COOKIE_DOMAIN }}
