name: Assign

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, reopened]

permissions: {}

# This runs on pull_request, not pull_request_target, which GitHub blocks by
# default in public repositories. Pull requests from forks and from Dependabot
# get a read-only token, so they are skipped instead of failing.

jobs:
  assign:
    name: Assign owners
    if: ${{ github.event_name == 'issues' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const isPull = Boolean(context.payload.pull_request);
            const subject = context.payload.pull_request || context.payload.issue;
            if ((subject.assignees || []).length > 0) return;

            // Translate a CODEOWNERS pattern into a regular expression.
            function toRegExp(pattern) {
              const anchored = pattern.startsWith("/");
              let body = pattern.replace(/^\//, "");
              const directory = body.endsWith("/");
              if (directory) body = body.slice(0, -1);
              const source = body
                .replace(/[.+^${}()|[\]\\]/g, "\\$&")
                .replace(/\*\*/g, "\u0000")
                .replace(/\*/g, "[^/]*")
                .replace(/\?/g, "[^/]")
                .replace(/\u0000/g, ".*");
              const start = anchored || body.includes("/") ? "^" : "^(?:.*/)?";
              return new RegExp(start + source + (directory ? "/.*$" : "(?:/.*)?$"));
            }

            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const text = Buffer.from(file.data.content, "base64").toString("utf8");
            const rules = [];
            for (const line of text.split("\n")) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;
              const [pattern, ...tokens] = trimmed.split(/\s+/);
              const owners = tokens.filter((token) => /^@[A-Za-z0-9-]+$/.test(token)).map((token) => token.slice(1));
              rules.push({ regexp: toRegExp(pattern), owners });
            }
            const everyOwner = [...new Set(rules.flatMap((rule) => rule.owners))];

            const assignees = new Set();
            if (isPull) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: subject.number,
                per_page: 100,
              });
              for (const changed of files) {
                // The last matching rule wins, as in CODEOWNERS itself.
                let matched = null;
                for (const rule of rules) {
                  if (rule.regexp.test(changed.filename)) matched = rule;
                }
                if (matched) matched.owners.forEach((name) => assignees.add(name));
              }
            }
            // Issues have no paths, and a pull request that no rule covers still
            // needs someone responsible, so both fall back to every listed owner.
            if (assignees.size === 0) everyOwner.forEach((name) => assignees.add(name));
            if (subject.user && subject.user.type === "User") assignees.add(subject.user.login);
            if (assignees.size === 0) return;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number: subject.number,
              assignees: [...assignees].slice(0, 10),
            });
