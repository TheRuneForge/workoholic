name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify-local

      - name: Download and verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml'

      - name: Install Node.js, npm and pipx from Ubuntu APT
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs npm pipx

      - name: Install project dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run tests
        id: tests
        env:
          MERGIFY_TEST_JOB_NAME: test (web)
        run: npm test

      - name: Mergify Test Engine Upload (Node.js tests)
        if: (success() || failure()) && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('junit.xml') != ''
        env:
          MERGIFY_TEST_JOB_NAME: test (node)
        run: |
          python3 tools/mergify-junit.py junit.xml
          pipx run --spec mergify-cli==2026.11.17 mergify ci junit-process junit.xml

      - name: Typecheck
        run: npm run typecheck

      - name: Deployment dry run
        run: sh tools/deploy.sh cloudflare.example.env --dry-run

      - name: Check addresses
        run: node tools/check-addresses.mjs
