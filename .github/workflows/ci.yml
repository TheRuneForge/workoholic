
name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download latest actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" latest "$RUNNER_TEMP"

      - name: Lint GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Install Node.js, npm and pipx from Ubuntu APT
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nodejs npm pipx

      - name: Install project dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run tests
        id: tests
        env:
          MERGIFY_TEST_JOB_NAME: test (web)
        run: npm test

      - name: Mergify CI Upload
        if: (success() || failure()) && hashFiles('junit.xml') != ''
        continue-on-error: true
        env:
          MERGIFY_TEST_JOB_NAME: test (node)
        run: |
          pipx run --spec mergify-cli==2026.11.8 mergify ci junit-process junit.xml

      - name: Typecheck
        run: npm run typecheck

      - name: Deployment dry run
        run: sh tools/deploy.sh cloudflare.example.env --dry-run

      - name: Check addresses
        run: node tools/check-addresses.mjs
